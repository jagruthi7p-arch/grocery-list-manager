services:
  # Backend API
  - type: web
    name: glm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false        # set manually in Render dashboard
      - key: CLIENT_URL
        fromService:
          name: glm-frontend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend static site
  - type: web
    name: glm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: glm-backend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
