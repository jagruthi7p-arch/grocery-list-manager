services:
  # ── Backend (Node/Express) ───────────────────────────────────────────────────
  - type: web
    name: glm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (Dashboard → glm-backend → Environment):
      # MONGO_URI  → your MongoDB Atlas connection string
      # JWT_SECRET → a long random secret
      # ADMIN_SECRET → your chosen admin registration secret
      - key: CLIENT_URL
        value: https://glm-frontend.onrender.com   # update if you rename the frontend service

  # ── Frontend (Vite / React – static site) ───────────────────────────────────
  - type: web
    name: glm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://glm-backend.onrender.com    # update if you rename the backend service
      - key: VITE_APP_URL
        value: https://glm-frontend.onrender.com   # update if you rename the frontend service
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
